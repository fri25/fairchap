<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>FaiChap — Connexion</title>
<link rel="icon" type="image/svg+xml" href="assets/img/icon.svg">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.min.js"></script>
<link rel="stylesheet" href="assets/css/login.css">
</head>
<body>

<div class="wrapper">

  <!-- ── PANNEAU MARQUE ── -->
  <aside class="brand-panel">
    <svg class="brand-curves" viewBox="0 0 640 800" preserveAspectRatio="xMidYMid slice" aria-hidden="true">
      <path d="M-20 20 C 200 -30 460 30 660 200 L 660 290 C 470 110 230 50 -20 92 Z"/>
      <path d="M-20 640 C 150 730 390 780 660 776 L 660 820 L -20 820 Z"/>
    </svg>
    <img src="assets/img/logo-faichap.svg" alt="FaiChap" class="brand-logo">
    <p class="brand-line">Les courses, les recettes et la caisse, tenues au même endroit.</p>
  </aside>

  <!-- ── FORMULAIRE ── -->
  <main class="form-panel">
    <div class="login-card">

      <img src="assets/img/logo-blue.svg" alt="FaiChap" class="mobile-logo">

      <h1 class="card-title">Connexion</h1>
      <p class="card-sub">Accès réservé à l'équipe FaiChap.</p>

      <div class="alert error" id="alert-error" role="alert">
        Email ou mot de passe incorrect. Veuillez réessayer.
      </div>

      <form id="login-form" onsubmit="handleLogin(event)" novalidate>

        <div class="form-group">
          <label class="form-label" for="email">Adresse e-mail</label>
          <input type="email" id="email" class="form-input" placeholder="nom@faichap.com" autocomplete="email" required>
          <div class="error-msg" id="email-error">Email invalide</div>
        </div>

        <div class="form-group">
          <div class="label-row">
            <label class="form-label" for="password">Mot de passe</label>
            <button type="button" class="toggle-pw" onclick="togglePassword()" id="toggle-pw-btn" aria-label="Afficher le mot de passe">
              <span id="eye-open">Afficher</span>
              <span id="eye-close" style="display:none">Masquer</span>
            </button>
          </div>
          <input type="password" id="password" class="form-input" autocomplete="current-password" required>
          <div class="error-msg" id="pw-error">Mot de passe requis</div>
        </div>

        <button type="submit" class="btn-login" id="btn-login">
          <span class="btn-text">Se connecter</span>
          <div class="spinner"></div>
        </button>

      </form>

      <p class="access-note">Pas encore de compte ? Les accès sont créés par l'administrateur.</p>
    </div>

    <div class="footer-note">© 2026 FaiChap</div>
  </main>

</div>

<script src="assets/js/config.js"></script>
<script src="assets/js/login.js"></script>
</body>
</html>
